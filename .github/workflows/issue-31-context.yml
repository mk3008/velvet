name: Issue 31 context evidence
on:
  pull_request:
    paths:
      - 'evaluations/issue-31/context/**'
      - '.github/workflows/issue-31-context.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node evaluations/issue-31/context/retirement-compare.mjs | tee retirement-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue-31-context-evidence
          path: retirement-comparison.json
