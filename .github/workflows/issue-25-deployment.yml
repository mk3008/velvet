name: Issue 25 deployment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/features/execute-transfer/**'
      - 'db/**'
      - 'tests/support/set-phase-fixture.ts'
      - 'evaluations/issue-25/**'
      - '.github/workflows/issue-25-deployment.yml'
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet
          POSTGRES_DB: velvet_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ASHIBA_DB_URL: postgres://velvet:velvet@localhost:5432/velvet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node evaluations/issue-25/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-25-deployment
          path: artifacts/
